[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-gateway"
version = "0.1.0"
description = "Relay: a portfolio-grade asynchronous HTTP API gateway (not production-certified)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# Compatible ranges here; exact resolved versions live in requirements*.lock.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "httpx>=0.28,<0.29",
    "redis>=5.2,<8.0",
    "pyyaml>=6.0,<7.0",
    "pydantic>=2.9,<3.0",
    "prometheus-client>=0.21,<1.0",
    # Not imported by Relay directly. httpcore tries `import sniffio` every time
    # it creates a lock; without it installed that import fails (and failed
    # imports are not cached), costing ~15% CPU per proxied request in profiling.
    "sniffio>=1.3,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=6.0,<8",
    "ruff>=0.8,<1.0",
    "fakeredis[lua]>=2.26,<3",
    "hypothesis>=6.100,<7",
    "mypy>=1.13,<2",
    "types-PyYAML>=6.0",
    "pip-audit>=2.7,<3",
    "mutmut>=3,<4",
]
# Benchmark analysis only (charts); never needed at runtime.
bench = [
    "matplotlib>=3.9,<4",
]

[project.scripts]
relay = "relay.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
relay = ["py.typed", "*.lua"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "S", "PT"]
ignore = [
    "S101",  # assert is fine in tests and for internal invariants
    "S311",  # random is used for retry jitter, not cryptography
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106"]
# PromQL strings read better unwrapped.
"scripts/build_dashboard.py" = ["E501", "UP031"]
"scripts/bench_matrix.py" = ["E501", "S310"]  # fixed localhost URLs only

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
# Third-party packages without complete type information.
[[tool.mypy.overrides]]
module = ["fakeredis.*", "lupa.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "redis: requires a real Redis server (set REDIS_URL); skipped when unavailable",
    "security: adversarial raw-socket tests (tests/security)",
]
addopts = "-ra --strict-markers"
pythonpath = ["tests"]

[tool.coverage.run]
source = ["relay", "mock_backend"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mutmut]
# Mutation testing of the pure-logic core (see docs/QUALITY.md).
source_paths = [
    "src/relay/cache/lru.py",
    "src/relay/cache/response_cache.py",
    "src/relay/cache/singleflight.py",
    "src/relay/resilience/circuit_breaker.py",
    "src/relay/resilience/retry.py",
    "src/relay/resilience/retry_budget.py",
    "src/relay/resilience/timeouts.py",
    "src/relay/routing.py",
    "src/relay/load_balancer.py",
    "src/relay/client_identity.py",
    "src/relay/headers.py",
]
pytest_add_cli_args_test_selection = ["tests/unit"]
also_copy = ["tests", "src/relay", "src/mock_backend", "config"]
