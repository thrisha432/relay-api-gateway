# Prometheus scrape config for the local Compose stack.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: relay
    metrics_path: /metrics
    static_configs:
      - targets: ["relay:8080"]
        labels:
          instance_name: relay-1
      # Second gateway instance (only running with `--profile multi`).
      - targets: ["relay-2:8080"]
        labels:
          instance_name: relay-2
