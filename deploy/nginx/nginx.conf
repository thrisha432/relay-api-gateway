# Reference reverse proxy for benchmarks: plain proxy_pass to backend-a with
# upstream keep-alive. worker_processes 1 so it gets one core, like Relay's
# single Uvicorn worker (apples-to-apples per core). No caching, no limits.
worker_processes 1;
events { worker_connections 4096; }
http {
  access_log off;
  upstream backend_a {
    server backend-a:8001;
    keepalive 64;
  }
  server {
    listen 8080;
    location / {
      proxy_pass http://backend_a;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $proxy_host;
    }
  }
}
