# Relay route configuration (Docker Compose demo).
# Upstream URLs are trusted configuration: clients can never choose a target.
# Secrets never belong here; use environment variables (see .env.example).

server:
  host: "0.0.0.0"          # inside the container; Compose publishes on 127.0.0.1 only
  port: 8080
  max_request_body_bytes: 1048576     # 1 MiB
  max_response_body_bytes: 10485760   # 10 MiB (responses are buffered, not streamed)
  trusted_proxies: []                 # X-Forwarded-For is ignored unless the peer is listed
  enable_route_summary: true
  # Admission control (Little's law: ~1,100 req/s x ~50 ms queueing = ~64).
  # Measured in benchmarks/: limit 32 kept goodput at capacity under 1.6x overload.
  max_in_flight: 64

redis:
  url: "redis://redis:6379/0"         # override with RELAY_REDIS_URL
  connect_timeout_seconds: 0.5
  operation_timeout_seconds: 0.5
  fail_open_for_rate_limit: false     # Redis down => 503 on rate-limited routes

cache:
  backend: "local"                    # "local" (per-process LRU) or "redis" (shared)
  max_entries: 1024

defaults:
  timeouts:
    connect_seconds: 0.5
    attempt_seconds: 2.0
    request_seconds: 5.0
  retries:
    max_attempts: 2                   # total attempts, including the first
    retry_status_codes: [502, 503, 504]
    retry_methods: ["GET", "HEAD", "OPTIONS"]
    backoff_base_seconds: 0.05
    backoff_max_seconds: 0.5
  health_check:
    path: "/health"
    interval_seconds: 2.0
    timeout_seconds: 0.5
    unhealthy_threshold: 3
    healthy_threshold: 2
  circuit_breaker:
    failure_threshold: 5
    recovery_timeout_seconds: 10.0
    half_open_max_probes: 1
    success_threshold: 1
    failure_status_codes: [502, 503, 504]

routes:
  - id: "catalog"
    path_prefix: "/api/catalog"
    upstreams:
      - id: "catalog-a"
        url: "http://backend-a:8001"
      - id: "catalog-b"
        url: "http://backend-b:8002"
    rate_limit:
      capacity: 60
      refill_rate_per_second: 10.0
    cache:
      enabled: true
      ttl_seconds: 10
      max_entry_bytes: 65536
      allowed_status_codes: [200]

  - id: "orders"
    path_prefix: "/api/orders"
    upstreams:
      - id: "orders-a"
        url: "http://backend-a:8001"
      - id: "orders-b"
        url: "http://backend-b:8002"
    rate_limit:
      capacity: 5
      refill_rate_per_second: 1.0
    retries:
      max_attempts: 1                 # no retries for this route

  # Benchmark routes. Single upstream (backend-a), exactly like the direct
  # baseline, so direct-vs-gateway compares the same backend work. No rate
  # limit, so k6 measures proxy overhead rather than 429s.
  - id: "bench"
    path_prefix: "/api/bench"
    upstreams:
      - id: "bench-a"
        url: "http://backend-a:8001"

  # Same as "bench" with caching on, for the cache-friendly scenario.
  - id: "bench-cached"
    path_prefix: "/api/bench-cached"
    upstreams:
      - id: "bench-cached-a"
        url: "http://backend-a:8001"
    cache:
      enabled: true
      ttl_seconds: 30

  # Two upstreams, no rate limit: used by the failure-injection benchmark and
  # the round-robin demo.
  - id: "bench-ha"
    path_prefix: "/api/bench-ha"
    upstreams:
      - id: "bench-ha-a"
        url: "http://backend-a:8001"
      - id: "bench-ha-b"
        url: "http://backend-b:8002"

  # ---- Benchmark-only routes (benchmarks/README.md) ------------------------
  # Same backends; each isolates one feature so its effect can be measured.

  # Rate limiting on, but with a limit no benchmark reaches: measures the cost
  # of the Redis Lua round trip, and is the route the Redis-outage chaos run uses.
  - id: "bench-limited"
    path_prefix: "/api/bench-limited"
    upstreams:
      - id: "bench-limited-a"
        url: "http://backend-a:8001"
    rate_limit:
      capacity: 1000000
      refill_rate_per_second: 1000000

  # Cache with coalescing disabled: the "before" side of the stampede benchmark.
  - id: "bench-nocoalesce"
    path_prefix: "/api/bench-nocoalesce"
    upstreams:
      - id: "bench-nocoalesce-a"
        url: "http://backend-a:8001"
    cache:
      enabled: true
      ttl_seconds: 30
      coalesce: false

  # Same as bench-ha with least-request balancing: compared with round-robin
  # in the backend-hang chaos scenario.
  - id: "bench-ha-lr"
    path_prefix: "/api/bench-ha-lr"
    load_balancing: "least_request"
    upstreams:
      - id: "bench-ha-lr-a"
        url: "http://backend-a:8001"
      - id: "bench-ha-lr-b"
        url: "http://backend-b:8002"

  # Brownout benchmark: retries enabled with (budget) and without (nobudget)
  # a retry budget. The breaker threshold is high so only the budget limits
  # retry amplification.
  - id: "bench-budget"
    path_prefix: "/api/bench-budget"
    upstreams:
      - { id: "bench-budget-a", url: "http://backend-a:8001" }
      - { id: "bench-budget-b", url: "http://backend-b:8002" }
    retries: { max_attempts: 3, budget_enabled: true }   # default budget: 20% of requests
    circuit_breaker: { failure_threshold: 1000 }
    health_check: { enabled: false }
  - id: "bench-nobudget"
    path_prefix: "/api/bench-nobudget"
    upstreams:
      - { id: "bench-nobudget-a", url: "http://backend-a:8001" }
      - { id: "bench-nobudget-b", url: "http://backend-b:8002" }
    retries: { max_attempts: 3, budget_enabled: false }
    circuit_breaker: { failure_threshold: 1000 }
    health_check: { enabled: false }

  # Single-upstream brownout: retries can only go back to the same struggling
  # backend, which is the retry-storm case a retry budget exists for.
  - id: "bench-budget-single"
    path_prefix: "/api/bench-budget-single"
    upstreams: [{ id: "bench-budget-single-a", url: "http://backend-a:8001" }]
    retries: { max_attempts: 3, budget_enabled: true }   # default budget: 20%
    circuit_breaker: { failure_threshold: 1000 }
    health_check: { enabled: false }
  - id: "bench-nobudget-single"
    path_prefix: "/api/bench-nobudget-single"
    upstreams: [{ id: "bench-nobudget-single-a", url: "http://backend-a:8001" }]
    retries: { max_attempts: 3, budget_enabled: false }
    circuit_breaker: { failure_threshold: 1000 }
    health_check: { enabled: false }
